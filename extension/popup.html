<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TabMind</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
    <header>
        <div class="headrow"><h1>TabMind</h1>
            <button id="openWindow">별도 창으로 열기 ↗</button>
        </div>
        <p>AI에게 정리 방식을 요청하고 적용 전 검토하세요.</p></header>
    <div class="summary"><strong id="count">불러오는 중...</strong>
        <button id="refresh">새로고침</button>
    </div>
    <p class="note">
        선택한 탭의 제목과 URL(쿼리·해시 제외), 정리 요청이 선택한 FastAPI 서버를 거쳐 Gemini로 전송됩니다. 민감한 탭은 제외하세요.
    </p>
    <section class="server-settings">
        <h2>AI 서버 설정</h2>
        <label for="serverMode">서버 선택</label>
        <select id="serverMode">
            <option value="local">Local (내 컴퓨터)</option>
            <option value="render">Render (클라우드)</option>
        </select>
        <div id="renderSettings" hidden>
            <label for="accessToken">Render 인증 토큰</label>
            <input
                    id="accessToken"
                    type="password"
                    placeholder="Render 인증 토큰 입력"
                    autocomplete="off"
                    spellcheck="false"
            />
        </div>
        <button id="saveServer">서버 설정 저장</button>
    </section>
    <ul id="tabs"></ul>
    <label for="instruction"><strong>AI에게 정리 방식 요청하기</strong></label>
    <textarea id="instruction" rows="4" maxlength="1500"
              placeholder="예: 채용공고는 회사별로, 개발 문서는 기술별로 묶어줘. 지금 읽을 자료는 별도 그룹으로 만들어줘."></textarea>
    <button id="suggest" class="primary">AI 정리안 제안받기</button>
    <section id="preview" hidden><h2>정리안 미리보기</h2>
        <p class="note">그룹 이름을 수정하거나 탭을 다른 그룹으로 옮길 수 있어요.</p>
        <div id="groups"></div>
        <button id="apply" class="primary">이 정리안 적용</button>
    </section>
    <section class="undoarea"><h2>되돌리기</h2>
        <p class="note">마지막 정리 적용 직전의 탭 그룹 및 순서로 되돌립니다. 탭을 닫았다면 완전히 복원되지 않을 수 있어요.</p>
        <button id="undo">마지막 정리 되돌리기</button>
    </section>
    <p id="status" role="status"></p>
    <p id="error" role="alert"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
